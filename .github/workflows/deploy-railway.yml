name: Deploy to Railway

on:
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Solo se i test sono passati
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy API to Railway
        if: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          railway link ${{ secrets.RAILWAY_API_SERVICE_ID }}
          railway up --service api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

      - name: Deploy Admin to Railway
        if: ${{ secrets.RAILWAY_ADMIN_TOKEN }}
        run: |
          railway link ${{ secrets.RAILWAY_ADMIN_SERVICE_ID }}
          railway up --service admin
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_ADMIN_TOKEN }}

      - name: Deploy Web to Railway
        if: ${{ secrets.RAILWAY_WEB_TOKEN }}
        run: |
          railway link ${{ secrets.RAILWAY_WEB_SERVICE_ID }}
          railway up --service web
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_WEB_TOKEN }}

      - name: Deploy status
        run: |
          echo "✅ Tests passed - Deployed to Railway"
          echo "Monitor deployments at: https://railway.app"
