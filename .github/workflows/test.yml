name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portfolio_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: portfolio_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck shared package
        run: bun run --filter @marcomarchione/shared typecheck

      - name: Run API tests
        run: bun run --filter @marcomarchione/api test
        env:
          NODE_ENV: test
          JWT_SECRET: development-secret-that-is-at-least-32-characters-long
          TEST_DATABASE_URL: postgres://portfolio_test:test_password@localhost:5433/portfolio_test

      - name: Build admin panel
        run: bun run --filter @marcomarchione/admin build
