# Railway Configuration for Monorepo
# See DEPLOY.md for complete setup instructions
#
# This monorepo requires 3 separate Railway services:
# 1. api   - Elysia REST API (packages/api)
# 2. admin - React Admin Panel (packages/admin)
# 3. web   - Astro Public Website (packages/web)
#
# Each service should be configured in Railway dashboard with:
# - Root Directory: / (repository root)
# - Dockerfile Path: packages/<service>/Dockerfile
# - Watch Paths: packages/<service>/**, packages/shared/**
#
# IMPORTANT: In Railway dashboard settings:
# - Enable "Deploy on GitHub Actions Success" or
# - Disable "Auto Deploy" and use GitHub workflow to trigger deploys
# - Configure Check Suites: Only deploy if "Tests" workflow passes

[build]
builder = "dockerfile"

[deploy]
# Railway will check GitHub Actions status before deploying
checkSuites = ["Tests"]
# Restart policy if deployment fails
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
